[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rps-cli"
version = "0.1.0"
description = "CLI-игра «камень, ножницы, бумага» со статистикой в SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
rps = "rps.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
